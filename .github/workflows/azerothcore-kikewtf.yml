name: azerothcore-kikewtf

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cosasdepuma/nix
  # Pin each module to a ref. Bump these manually to pull in upstream
  # changes -- nothing here tracks them automatically.
  MOD_PLAYERBOTS_REF: master
  MOD_ALE_REF: master
  MOD_SPELLDRAFT_REF: main
  MOD_HARDCORE_REF: main
  MOD_AH_BOT_PLUS_REF: master
  MOD_DUNGEON_CLEAR_REF: master
  MOD_AOE_LOOT_REF: master
  MOD_DUNGEON_SCALE_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Checkout azerothcore-wotlk (Playerbot branch)
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: Playerbot
          path: core

      - name: Clone extra modules
        run: |
          cd core/modules
          git clone --depth 1 --branch "$MOD_PLAYERBOTS_REF" https://github.com/mod-playerbots/mod-playerbots.git
          git clone --depth 1 --branch "$MOD_ALE_REF" https://github.com/azerothcore/mod-ale.git
          git clone --depth 1 --branch "$MOD_SPELLDRAFT_REF" https://github.com/bdodroid/mod-spelldraft.git
          git clone --depth 1 --branch "$MOD_HARDCORE_REF" https://github.com/Zindokar/mod-hardcore.git
          git clone --depth 1 --branch "$MOD_AH_BOT_PLUS_REF" https://github.com/NathanHandley/mod-ah-bot-plus.git
          git clone --depth 1 --branch "$MOD_DUNGEON_CLEAR_REF" https://github.com/jrad7/mod-dungeon-clear.git
          git clone --depth 1 --branch "$MOD_AOE_LOOT_REF" https://github.com/azerothcore/mod-aoe-loot.git
          git clone --depth 1 --branch "$MOD_DUNGEON_SCALE_REF" https://github.com/NathanHandley/mod-dungeon-scale.git

      - name: Apply mod-spelldraft core patches
        run: |
          cd core/modules/mod-spelldraft
          ./install.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service images
        run: |
          set -euo pipefail
          for target in worldserver authserver db-import client-data; do
            docker buildx build \
              --file core/apps/docker/Dockerfile \
              --target "$target" \
              --tag "${IMAGE}:azerothcore-${target}" \
              --push \
              core
          done

      # mod-playerbots (and, per its own install notes, mod-spelldraft) auto-
      # populate their dedicated tables by reading SQL straight out of
      # modules/<name>/data/sql/ at worldserver startup -- but the upstream
      # Dockerfile's worldserver stage only copies the compiled binary, not
      # the modules/ tree it was built from, so that lookup fails at runtime
      # ("Directory .../mod-playerbots/data/sql/playerbots/base/ not exist").
      #
      # Separately, mod-spelldraft's actual level-up-choice popup isn't C++
      # at all -- it's entirely Eluna Lua (modules/mod-spelldraft/lua/), and
      # Eluna (ALE.ScriptPath, default "lua_scripts") loads scripts from
      # env/dist/lua_scripts/ at runtime, which -- same story -- the upstream
      # Dockerfile never creates or populates. Without it, mod-ale finds
      # nothing to load and spelldraft's whole gameplay hook silently never
      # fires, even though the C++ side (SpellDraft.Enable etc.) looks
      # perfectly healthy in the logs.
      #
      # Layer both back on top of the image we just pushed to fix that.
      - name: Bundle modules/ and lua_scripts/ into the worldserver image
        run: |
          set -euo pipefail
          cat > /tmp/with-modules.Dockerfile <<'DOCKERFILE'
          ARG BASE
          FROM ${BASE}
          COPY modules /azerothcore/modules
          COPY modules/mod-spelldraft/lua /azerothcore/env/dist/lua_scripts
          DOCKERFILE
          docker buildx build \
            --file /tmp/with-modules.Dockerfile \
            --build-arg BASE="${IMAGE}:azerothcore-worldserver" \
            --tag "${IMAGE}:azerothcore-worldserver" \
            --push \
            core
